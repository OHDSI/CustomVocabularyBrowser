name: Test vocabulary browser

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out browser
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install build tooling
        run: npm ci

      - name: Reject tracked package data
        run: npm run check:no-package-data

      - name: Test
        run: npm test

      - name: Package static site
        run: npm run build:site
